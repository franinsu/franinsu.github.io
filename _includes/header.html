<header class="site-header" role="banner">
  <div class="wrapper site-header-inner">
    <span class="site-title">{{ site.title | escape }}</span>

    <nav class="site-nav" aria-label="Main navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" aria-label="Toggle navigation" aria-controls="site-menu" />
      <label for="nav-trigger" aria-hidden="true">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px" aria-hidden="true" focusable="false">
            <path
              d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484
                 C0,0.665,0.665,0,1.484,0h15.032C17.335,0,18,0.665,18,1.484z
                 M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516
                 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516z
                 M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516
                 c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516z"
            />
          </svg>
        </span>
      </label>

      <div class="trigger" id="site-menu">
        <a class="page-link" href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a class="page-link" href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
      </div>
    </nav>

    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle color theme"
    ></button>
  </div>
</header>
