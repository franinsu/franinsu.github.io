<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <script>
    // Set the theme before first paint: a saved choice wins, otherwise follow the system setting.
    (function () {
      var root = document.documentElement;
      var stored = null;
      try {
        stored = window.localStorage.getItem("theme");
      } catch (e) {}
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      root.dataset.theme = stored === "light" || stored === "dark" ? stored : system;

      // Filled icons drawn inline so they look the same in every font.
      var ICONS = {
        moon: '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
        sun: '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>'
      };

      function label(theme) {
        var btn = document.getElementById("theme-toggle");
        if (btn) btn.innerHTML = theme === "dark" ? ICONS.sun + "Light" : ICONS.moon + "Dark";
      }

      document.addEventListener("DOMContentLoaded", function () {
        label(root.dataset.theme);
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var next = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = next;
          try {
            window.localStorage.setItem("theme", next);
          } catch (e) {}
          label(next);
        });
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/quiet.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if page.math -%}
    {%- include math.html -%}
  {%- endif -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
